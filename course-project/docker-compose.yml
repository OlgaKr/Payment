services:
  api:
    image: ghcr.io/yyushchenko/merchant-api:1.0
    # For local dev, replace with: build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://payments:payments@db:5432/payments_db
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_test}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - '5433:5432' # host 5433 avoids clashing with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payments -d payments_db']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  stripe-cli:
    image: stripe/stripe-cli:latest
    command: listen --forward-to api:3000/api/webhooks --api-key ${STRIPE_SECRET_KEY}
    depends_on:
      - api
    profiles:
      - webhooks

volumes:
  pgdata:
